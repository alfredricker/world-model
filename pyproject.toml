[project]
name = "worldmodel"
version = "0.1.0"
description = "A learned world model, built one tested step at a time"
requires-python = ">=3.13, <3.14"
dependencies = [
    "numpy (>=2.5.1,<3.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "minigrid (>=3.1.0,<4.0.0)",
]

[tool.poetry]
packages = [{include = "worldmodel", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
